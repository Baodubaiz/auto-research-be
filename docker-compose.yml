services:
  auto-research-be:
    build:
      context: .
      dockerfile: Dockerfile
    image: auto-research-be:local
    container_name: auto-research-be
    env_file:
      - .env
    environment:
      NODE_ENV: production
      IS_LOCAL: "false"
      PORT: 3001
    ports:
      - "3001:3001"
    restart: unless-stopped
